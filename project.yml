name: DSHPhone
options:
  bundleIdPrefix: com.dsh.phone
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.1.1"
    CURRENT_PROJECT_VERSION: "3"
    ENABLE_BITCODE: NO
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  DSHPhone:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: DSHPhone
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dsh.phone
        PRODUCT_NAME: DSHPhone
        INFOPLIST_FILE: DSHPhone/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: DSHPhone/Info.plist
      properties:
        CFBundleDisplayName: dsh
        CFBundleShortVersionString: "1.1.1"
        CFBundleVersion: "3"
        UILaunchScreen:
          UIColorName: ""
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: "Discover and connect to the dsh gateway running on your computer over the local network."
        NSBonjourServices:
          - "_dsh._tcp"
          - "_dsh._tcp."
        # NOTE: NSAllowsLocalNetworking MUST NOT be present 鈥?on iOS 10+ its presence
        # makes ATS ignore NSAllowsArbitraryLoads, and it only whitelists .local /
        # unqualified hostnames plus 169.254/16 鈥?NOT RFC1918 literals like 192.168.x.x.
        # With it in place every http://192.168.* request fails with -1022.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false

