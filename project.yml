name: DSHPhone
options:
  bundleIdPrefix: com.dsh.phone
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_BITCODE: NO
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  DSHPhone:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: DSHPhone
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dsh.phone
        PRODUCT_NAME: DSHPhone
        INFOPLIST_FILE: DSHPhone/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: DSHPhone/Info.plist
      properties:
        CFBundleDisplayName: dsh
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: "鐢ㄤ簬鍦ㄥ悓涓€鍊?Wi-Fi 涓嬪彂鐜板苟杩炴帴浣犵數鑴戜笂鐨?dsh 缃戝叧銆?
        NSBonjourServices:
          - "_dsh._tcp"
          - "_dsh._tcp."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false

